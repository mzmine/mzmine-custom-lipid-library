name: Validate lipid classes

on:
  pull_request:
    paths: ["classes/**", "schema/**", "scripts/**", "site/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate class files
        run: python scripts/validate.py
      - name: Build catalog
        run: python scripts/build_site.py
